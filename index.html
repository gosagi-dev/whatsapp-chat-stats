<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--bg:#f4f6f5;--card:#fff;--fg:#14201c;--mute:#5d6d67;--line:#dbe3df;--accent:#0b7a62;--bar:#0b7a62;--bar-bg:#e3ece8;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#16201c;--fg:#e8f0ec;--mute:#93a59d;--line:#27352f;--accent:#3ed3a8;--bar:#3ed3a8;--bar-bg:#22302a;--warn:#e0a84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#16201c;--fg:#e8f0ec;--mute:#93a59d;--line:#27352f;--accent:#3ed3a8;--bar:#3ed3a8;--bar-bg:#22302a;--warn:#e0a84a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
h2{font-size:1.2rem;margin:8px 0 0}
select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h1{min-width:0}
.mute{color:var(--mute);font-size:.9rem}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 16px;background:var(--card);cursor:pointer}
.drop:focus-within,.drop.over{border-color:var(--accent)}
.drop strong{color:var(--accent);font-size:1.1rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;min-width:0}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mute)}
.banner{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.9rem}
.err{border-color:#c0392b;color:#c0392b}
.opts{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
label.chk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;min-width:0}
.name{overflow-wrap:anywhere;min-width:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.num b{font-size:1.05rem}
.bar{grid-column:1/-1;height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.sub{grid-column:1/-1;font-size:.8rem;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center;margin-top:8px}
.nrow label{overflow-wrap:anywhere;font-size:.85rem}
input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
#imgBox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);overflow:auto;padding:max(56px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.imgCard{max-width:520px;margin:0 auto;background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.imgCard img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<main id="app" dir="ltr" lang="en">
  <header class="top">
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <h1 data-i18n="h1"></h1>
      <p class="mute" data-i18n="intro"></p>
    </div>
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="he">עברית</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
    </select>
  </header>

  <label class="drop" id="drop">
    <strong data-i18n="pick"></strong>
    <span class="mute" data-i18n="pickHint"></span>
    <input type="file" id="file">
  </label>

  <div id="msg" class="banner" hidden></div>

  <section id="out" style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span data-i18n="msgs"></span></div>
      <div class="stat"><b id="sUsers">0</b><span data-i18n="users"></span></div>
      <div class="stat"><b id="sAvg">0</b><span data-i18n="avg"></span></div>
    </div>
    <p class="mute" id="range"></p>
    <div class="opts">
      <label class="chk" for="media"><input type="checkbox" id="media" checked> <span data-i18n="countMedia"></span></label>
      <span class="btns"><button id="copy" type="button" data-i18n="pdf"></button><button id="img" type="button" data-i18n="img"></button></span>
    </div>
    <div id="youBox" class="opts" hidden>
      <label class="chk" for="youSel"><span data-i18n="youQ"></span>
        <select id="youSel"></select>
      </label>
    </div>
    <details id="names">
      <summary data-i18n="namesSummary"></summary>
      <p class="mute" data-i18n="namesNote"></p>
      <div id="nameList"></div>
    </details>
    <ol id="list"></ol>

    <h2 data-i18n="startsTitle"></h2>
    <div class="opts">
      <label class="chk" for="gap"><span data-i18n="gapLbl"></span>
        <select id="gap">
          <option value="1" data-i18n="g1"></option>
          <option value="3" data-i18n="g3"></option>
          <option value="6" data-i18n="g6" selected></option>
          <option value="12" data-i18n="g12"></option>
          <option value="24" data-i18n="g24"></option>
        </select>
      </label>
      <span class="mute" id="convCount"></span>
    </div>
    <ol id="starts"></ol>
  </section>
</main>
<div id="imgBox" dir="ltr" hidden>
  <div class="imgCard">
    <div class="btns"><button id="imgShare" type="button" data-i18n="share"></button><button id="imgClose" type="button" data-i18n="close"></button></div>
    <p class="mute" data-i18n="imgHelp"></p>
    <img id="imgOut" alt="">
    <p class="banner err" id="shareMsg" hidden></p>
  </div>
</div>

      if(dl){
        dl.save({filename:"WhatsApp Group Report.pdf", data:blob}).catch(function(e){ if(!e || e.code !== "declined") setNote("pdfNote"); });
      } else if(file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).catch(function(e){ if(!e || e.name !== "AbortError") download(); });
      } else download();
    });
  });

  $("img").addEventListener("click", function(){
    $("imgOut").src = makeImage(); $("shareMsg").hidden = true; $("imgBox").hidden = false; $("imgBox").scrollTop = 0;
  });
  $("imgShare").addEventListener("click", function(){
    function fail(){ var m = $("shareMsg"); m.textContent = t("shareFail"); m.hidden = false; }
    if(!lastCanvas){ fail(); return; }
    lastCanvas.toBlob(function(blob){
      getDl().then(function(dl){
        if(dl){
          dl.save({filename:"WhatsApp Group Report.png", data:blob}).catch(function(e){ if(!e || e.code !== "declined") fail(); });
          return;
        }
        if(!navigator.share){ fail(); return; }
      try{
        var f = new File([blob], "WhatsApp Group Report.png", {type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[f]})){
          navigator.share({files:[f]}).catch(function(e){ if(!e || e.name !== "AbortError") fail(); });
        } else fail();
      }catch(_){ fail(); }
      });
    }, "image/png");
  });
  $("imgClose").addEventListener("click", function(){ $("imgBox").hidden = true; });

  $("out").style.display = "none";
  applyLang();
})();
</script>
</body>
</html>
